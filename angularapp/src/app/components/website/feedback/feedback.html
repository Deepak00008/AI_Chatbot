<div class="feedback-wrap">
  <div class="brand">
    <img src="/assets/logo.jpeg" alt="AI" class="logo" />
    <h2>AI ChatBot</h2>
  </div>
  <!--<img src="/assets/logo.jpeg" alt="Logo" class="logo" />-->
  <h2>We value your feedback</h2>
  <div class="stars">
    <button *ngFor="let s of [1,2,3,4,5]" (click)="setRating(s)" [class.active]="rating >= s">★</button>
  </div>
  <textarea [(ngModel)]="text" rows="5" placeholder="Tell us about your experience..."></textarea>
  
  <!-- Error Message -->
  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>
  
  <!-- Success Message -->
  <div *ngIf="successMessage" class="success-message">
    {{ successMessage }}
  </div>
  
  <button class="submit" (click)="submit()" [disabled]="isSubmitting">
    {{ isSubmitting ? 'Submitting...' : 'Submit' }}
  </button>
</div>
